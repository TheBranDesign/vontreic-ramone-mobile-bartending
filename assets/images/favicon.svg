<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E0A3" />
      <stop offset="45%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA7C11" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#D4AF37" flood-opacity="0.35"/>
    </filter>
  </defs>
  <circle cx="50" cy="50" r="48" fill="#0C0C0E" stroke="url(#goldGrad)" stroke-width="2.5" />
  <circle cx="50" cy="50" r="44" fill="none" stroke="url(#goldGrad)" stroke-width="0.75" stroke-dasharray="3, 3" opacity="0.6" />
  <g filter="url(#goldGlow)">
    <!-- Stylized Cocktail Coupe / Monogram VR -->
    <path d="M30 32 C30 46 47 52 47 62 L45 74 L55 74 L53 62 C53 52 70 46 70 32 Z" fill="none" stroke="url(#goldGrad)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="33" y1="36" x2="67" y2="36" stroke="url(#goldGrad)" stroke-width="1.2" opacity="0.8" />
    <!-- V & R motif -->
    <text x="50" y="47" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="12" font-weight="700" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="1">VR</text>
    <circle cx="50" cy="36" r="2.2" fill="url(#goldGrad)" />
  </g>
</svg>